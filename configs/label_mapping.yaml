validation:
  checked_at: '2026-09-24'
  official_source: https://www.unb.ca/cic/datasets/iotdataset-2023.html
  official_statement: 33 attacks are executed in an IoT topology composed of 105 devices.
    These attacks are classified into seven categories
  result: 32 dos 33 rótulos de ataque correspondem um a um à lista oficial por categoria
    (incluindo VULNERABILITYSCAN em Recon, confirmado pelo autor); BENIGN fica fora
    das 7 categorias
  discrepancy: a página oficial lista 11 ataques DDoS (32 no total) e não menciona
    ICMP fragmentation; os CSVs contêm DDOS-ICMP_FRAGMENTATION, mapeado para DDoS
    pelo prefixo do próprio rótulo. Divergência registrada, não resolvida pela documentação
    oficial
