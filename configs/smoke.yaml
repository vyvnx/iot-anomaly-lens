# configuração SINTÉTICA de fumaça (verificação de software). NÃO produz resultados do CICIoT2023.
# saídas isoladas em tests/output/smoke/.
project: tc2_iot_anomaly
experiment_kind: smoke
data_kind: synthetic
output_dir: tests/output/smoke/runs
data:
  raw_dir: tests/output/smoke/raw
  processed_dir: tests/output/smoke/processed
  source_manifest: tests/output/smoke/raw_manifest.json
  label_mapping: tests/fixtures/label_mapping_synthetic.yaml
  feature_allowlist: tests/fixtures/feature_allowlist_synthetic.yaml
  label_column: auto          # detectada na inspeção; defina o nome se houver ambiguidade
  files: all                  # ou lista explícita de nomes relativos (plano de amostragem)
  invalid_policy: drop
  duplicate_policy: unique_feature_vectors
  conflicting_labels: drop_binary_ambiguous
sample:
  benign_cap: 5000
  category_caps: {DDoS: 500, DoS: 250, Recon: 250, Web-based: 250, Brute Force: 250, Spoofing: 250, Mirai: 250}
  ambiguous_cap: 6
  seed: 2026
  min_attack_per_category_per_test: 20
split:
  mode: random_unique_vectors
  seed: 2027
  justification: "fixture sintética sem metadados de captura"
  benign_fractions:
    train: 0.60
    validation_fit: 0.10
    validation_calibration: 0.10
    test_initial: 0.10
    test_confirmatory: 0.10
  attack_fractions:
    test_initial: 0.50
    test_confirmatory: 0.50
preprocessing:
  drop_train_constants: true
  scaler: standard
experiment:
  model_seeds: [42, 43]
  target_fpr: 0.01
  quantile_method: higher
  decision_operator: greater_than
  device: cpu
  threads: auto               # resolve para núcleos físicos
  confirmatory_evaluation: false
  calibration_min_warning: 1000
models:
  isolation_forest:
    n_estimators: 50
    max_samples: 256
    contamination: auto
    max_features: 1.0
    bootstrap: false
  sgd_one_class_svm:
    variant: nystroem_rbf
    components: 256
    gamma: inverse_feature_count
    nu: 0.01
    max_iter: 2000
    tol: 0.0001
    average: true
    shuffle: true
  autoencoder:
    hidden_dimensions: [32, 8, 32]
    batch_size: 256
    max_epochs: 8
    learning_rate: 0.001
    weight_decay: 0.0
    patience: 5
    min_delta: 0.00001
benchmark:
  warmup_passes: 1
  repeats: 2
  inference_batch_size: 4096
