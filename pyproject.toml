[project]
name = "tc2-iot"
version = "0.1.0"
description = "TC II — comparação de Isolation Forest, SGD One-Class SVM (Nyström) e Autoencoder no CICIoT2023"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scikit-learn",
    "torch",
    "pyarrow",
    "duckdb",
    "pandas",
    "matplotlib",
    "psutil",
    "pyyaml",
    "joblib",
]

[project.scripts]
tc2-iot = "tc2_iot.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc2_iot"]

# pytorch cpu wheels: the main comparison is on cpu; cuda is an optional extra run
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
